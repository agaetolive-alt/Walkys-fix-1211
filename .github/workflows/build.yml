name: Build Walksy 1.21.11
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/gradle-build-action@v2
      - run: ./gradlew remapJar --info
      - run: ls -lh build/libs/ && unzip -l build/libs/*.jar | head -n 100
      - uses: actions/upload-artifact@v4
        with:
          name: walksy-1.21.11-fixed
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
